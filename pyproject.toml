[project]
name = "metashape-mcp"
version = "0.46.0"
description = "MCP server for Agisoft Metashape with reversible processing and controlled automation"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "darnhalm" }]
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: GIS",
]
dependencies = ["mcp==2.3.0"]

[tool.uv]
package = false
